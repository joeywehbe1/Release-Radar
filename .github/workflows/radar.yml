name: Release Radar

on:
  schedule:
    - cron: "*/5 * * * *"     # full check (GitHub usually starts these every 10-20 min in practice)
    # Release windows, every day: quick new-drop checks every 20s around local midnight.
    # Two start times each, because daylight saving moves midnight by an hour; the one that
    # isn't near midnight exits straight away.
    - cron: "17 10,11 * * *"  # New Zealand midnight (11:00 or 12:00 UTC)
    - cron: "17 3,4 * * *"    # US Eastern midnight (04:00 or 05:00 UTC)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
    inputs:
      watch_minutes:
        description: "Watch for new drops every 20s for this many minutes (0 = one full check)"
        default: "0"

permissions:
  contents: write             # to save state on the bot-state branch

concurrency:
  group: release-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Load saved state
        run: |
          mkdir -p state
          if git fetch --quiet --depth=1 origin bot-state 2>/dev/null; then
            git show FETCH_HEAD:state.json > state/state.json
            echo "Loaded saved state ($(wc -c < state/state.json) bytes)"
          else
            echo "No saved state yet: this run is the bootstrap."
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and post alerts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          SCHEDULE: ${{ github.event.schedule }}
          WATCH_MINUTES: ${{ inputs.watch_minutes }}
        run: |
          case "$SCHEDULE" in
            "17 10,11 * * *"|"17 3,4 * * *")
              python -m radar watch --state state/state.json --save-cmd "bash .github/save-state.sh" ;;
            *)
              if [ "${WATCH_MINUTES:-0}" != "0" ]; then
                python -m radar watch --minutes "$WATCH_MINUTES" --state state/state.json --save-cmd "bash .github/save-state.sh"
              else
                timeout 10m python -m radar run --state state/state.json
              fi ;;
          esac

      # Runs even if the step above failed part-way, so posted songs are never posted twice.
      - name: Save state
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/save-state.sh
