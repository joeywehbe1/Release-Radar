name: Release Radar

on:
  schedule:
    - cron: "*/5 * * * *"     # full check every 5 min (GitHub may start it a few minutes late)
    - cron: "17 10 * * 4"     # Thursday burst: New Zealand midnight on release day (11:00-12:00 UTC)
    - cron: "17 3 * * 5"      # Friday burst: US midnight on release day (04:00-05:00 UTC)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
    inputs:
      burst_minutes:
        description: "Check about every minute for this many minutes (0 = one full check)"
        default: "0"

permissions:
  contents: write             # to save state on the bot-state branch

concurrency:
  group: release-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Load saved state
        run: |
          mkdir -p state
          if git fetch --quiet --depth=1 origin bot-state 2>/dev/null; then
            git show FETCH_HEAD:state.json > state/state.json
            echo "Loaded saved state ($(wc -c < state/state.json) bytes)"
          else
            echo "No saved state yet: this run is the bootstrap."
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and post alerts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          SCHEDULE: ${{ github.event.schedule }}
          BURST_INPUT: ${{ inputs.burst_minutes }}
        run: |
          case "$SCHEDULE" in
            "17 10 * * 4"|"17 3 * * 5") minutes=150 ;;   # covers both summer and winter time
            *) minutes="${BURST_INPUT:-0}" ;;
          esac
          if [ "$minutes" -gt 0 ]; then
            bash .github/burst.sh "$minutes"
          else
            timeout 10m python -m radar run --state state/state.json
          fi

      # Runs even if the step above failed part-way, so posted songs are never posted twice.
      - name: Save state
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/save-state.sh
